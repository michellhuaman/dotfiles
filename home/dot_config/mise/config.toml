# CLI tools, installed per user by mise. chezmoi runs `mise install` and
# `mise prune` whenever this file changes, so it's the whole set: a tool
# removed here is uninstalled on the next apply.
#
# Not pinned: "latest" is installed once, and `update` (.bashrc) upgrades them.

[tools]
bat = "latest"
starship = "latest"
chezmoi = "latest"                # this repo's manager
