# What chezmoi installs in your home folder, without sudo.
#
# System packages (layered RPMs, COPRs) live in the workstation-bootstrap
# repo instead, which also installs Bitwarden and chezmoi itself.
# Editing any list here makes the matching run_onchange_ script rerun
# on the next `chezmoi apply`.

packages:
  # Installed per user from Flathub (no root, no polkit prompt).
  flatpak:
    - com.bitwarden.desktop     # also installed by setup.sh, as the SSH agent
    - io.github.celluloid_player.Celluloid
    - org.libreoffice.LibreOffice
    - org.localsend.localsend_app
    - net.ankiweb.Anki
    - org.gnome.Extensions
    - com.brave.Browser         # turn on Origin mode in Settings > System

fonts:
  # Bump a version to make the font script download it again.
  nerd_fonts: v3.5.1              # JetBrainsMono Nerd Font

mise:
  # mise itself (the tools it installs are in dot_config/mise/config.toml).
  # To update: new version from https://github.com/jdx/mise/releases, and its
  # two linux lines from that release's SHASUMS256.txt.
  version: v2026.10.25
  sha256:
    amd64: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87   # mise-*-linux-x64
    arm64: bb09e88b13164ca90691a5cc042726d079f0ba26ab55527344cb173c2e83c998   # mise-*-linux-arm64

services:
  # User units from dot_config/systemd/user, enabled and started after files
  # are applied.
  user:
    - flatpak-user-manager.timer  # daily flatpak update, on AC power only
