# What chezmoi installs in your home folder, without sudo.
#
# System packages (apt, mise included) live in the workstation-bootstrap
# repo instead, which also installs Bitwarden and chezmoi itself.
# Editing any list here makes the matching run_onchange_ script rerun
# on the next `chezmoi apply`.

packages:
  # Installed per user from Flathub (no root, no polkit prompt). Brave and VS
  # Code are apt packages instead (workstation-bootstrap). This is the
  # whole set: per-user apps not listed here are uninstalled (their data in
  # ~/.var/app stays).
  flatpak:
    - com.bitwarden.desktop     # also installed by setup.sh, as the SSH agent
    - io.github.celluloid_player.Celluloid
    - org.libreoffice.LibreOffice
    - org.localsend.localsend_app
    - net.ankiweb.Anki
    - org.gnome.Boxes           # VMs (KVM), e.g. to test workstation-bootstrap branches
    - org.virt_manager.virt-manager  # Virtual Machine Manager, for the host's libvirt (QEMU/KVM, from workstation-bootstrap)
    - com.mattjakeman.ExtensionManager  # GNOME Shell extensions: browse, install and configure them from extensions.gnome.org

fonts:
  # Bump a version to make the font script download it again.
  nerd_fonts: v3.5.1              # JetBrainsMono Nerd Font

services:
  # User units from dot_config/systemd/user, enabled and started after files
  # are applied.
  user:
    - flatpak-user-manager.timer  # daily flatpak update, on AC power only
