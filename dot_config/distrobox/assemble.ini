# Containers built by `distrobox assemble`, which chezmoi runs whenever this
# file changes (run_onchange_after_35-distrobox.sh.tmpl). This is the whole
# state: a change rebuilds the container from scratch (--replace), so
# anything installed in it by hand is lost; your home folder is shared and
# never touched.
#
# dev: GUI and CLI tools that don't belong on the host, from Fedora's repos.
# The apps show up in rofi / the app grid, and the commands work in the
# host's terminal. (VS Code is an apt package on the host instead, from
# workstation-bootstrap.)

[dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
additional_packages="htop btop"
exported_apps="htop btop"
exported_bins="/usr/bin/htop /usr/bin/btop"
