# Containers built by `distrobox assemble`, which chezmoi runs whenever this
# file changes (run_onchange_after_35-distrobox.sh.tmpl). This is the whole
# state: a change rebuilds the container from scratch (--replace), so
# anything installed in it by hand is lost; your home folder is shared and
# never touched.
#
# dev: GUI and CLI tools that don't belong on the host, from Fedora's repos
# (and Microsoft's for VS Code). The apps show up in rofi / the app grid,
# and the commands work in the host's terminal.

[dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
# Microsoft's VS Code repo, with signature checks on (their own repo file
# turns them off). One line per hook: they run in order, joined by &&.
pre_init_hooks=echo '[code]' > /etc/yum.repos.d/vscode.repo
pre_init_hooks=echo 'name=Visual Studio Code' >> /etc/yum.repos.d/vscode.repo
pre_init_hooks=echo 'baseurl=https://packages.microsoft.com/yumrepos/vscode' >> /etc/yum.repos.d/vscode.repo
pre_init_hooks=echo 'enabled=1' >> /etc/yum.repos.d/vscode.repo
pre_init_hooks=echo 'gpgcheck=1' >> /etc/yum.repos.d/vscode.repo
pre_init_hooks=echo 'gpgkey=https://packages.microsoft.com/keys/microsoft.asc' >> /etc/yum.repos.d/vscode.repo
additional_packages="code htop btop"
exported_apps="code htop btop"
exported_bins="/usr/bin/code /usr/bin/htop /usr/bin/btop"
