[general]
; Color temperature to use during daytime and night
temp-day=5700
temp-night=4000

; Enable smooth fade between temperatures
fade=1

; Screen brightness (1.0 = full brightness)
brightness-day=1.0
brightness-night=1.0

; Use a fixed location instead of geoclue2 (adjust to your coordinates)
location-provider=manual

; Use wayland adjustment method for Sway
adjustment-method=wayland

[manual]
lat=40.4
lon=-3.7
