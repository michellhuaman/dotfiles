<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Fall back to JetBrainsMono Nerd Font when JetBrains Mono is not installed.
    Needed by apps that only take a single font family (e.g. alacritty).
  -->
  <alias binding="same">
    <family>JetBrainsMono</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>JetBrains Mono</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
    </accept>
  </alias>
</fontconfig>
