# Bitwarden as a floating window in the middle of the screen, on whichever
# workspace it's opened (from the tray, rofi or at login). Its launcher
# forces X11, so it's an XWayland window (class); the app_id match covers it
# under Wayland. The size is set because Bitwarden reopens at its last size,
# which can be a whole tiled screen.

for_window [class="^bitwarden$"] {
    floating enable
    resize set 1000 750
    move position center
}

for_window [app_id="^(?i)bitwarden$"] {
    floating enable
    resize set 1000 750
    move position center
}

# The Bitwarden browser extension's pop-out window in Brave (app_id is
# brave-<extension id>-<profile>). Floats at the size it asks for.
for_window [app_id="^brave-nngceckbapebfimnlniiiahkandclblb-"] {
    floating enable
    move position center
}
