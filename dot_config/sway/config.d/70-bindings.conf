# Personal keybindings, on top of Fedora's sway config (/etc/sway/config and
# /usr/share/sway/config.d/). This file is read after Fedora's, so a binding
# here replaces Fedora's for the same keys.

# Alacritty instead of foot. Fedora's bindings use $term before this file is
# read (sway fills variables in as it reads), so they're redefined here.
set $term alacritty
bindsym $mod+Return exec $term
set $menu rofi -terminal '$term' -show combi -combi-modes drun#run -modes combi
bindsym $mod+d exec $menu

# Same keys as in GNOME and niri.
bindsym $mod+e exec thunar
bindsym $mod+Shift+Return exec flatpak run com.brave.Browser
bindsym $mod+Shift+e exec ~/.local/bin/powermenu.sh
bindsym $mod+Shift+t exec ~/.local/bin/theme-toggle.sh
bindsym $mod+Shift+b exec ~/.local/bin/ddc-brightness.sh

# Fedora had "toggle split" on $mod+e, which now opens Thunar.
bindsym $mod+t layout toggle split
