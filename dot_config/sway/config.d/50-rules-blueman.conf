# Bluetooth windows (blueman-manager, -adapters, -services, -sendto) as
# floating windows in the middle of the screen, like Fedora's rule for
# pavucontrol (/usr/share/sway/config.d/50-rules-pavucontrol.conf). The size
# is set because blueman reopens at its last size, which can be a full
# tiled column.

for_window [app_id="^blueman-"] {
    floating enable
    resize set 800 600
    move position center
}
