# US and US International (dead keys for accents: ' then e gives é).
# waybar's sway/language module shows the active one.
# Caps Lock and Escape are swapped, on every keyboard.
input type:keyboard {
    xkb_layout "us,us"
    xkb_variant ",intl"
    xkb_options "caps:swapescape"
}

# $mod+Space switches layouts, as in GNOME. Fedora had "focus
# mode_toggle" (focus between tiling and floating windows) there; it moves
# to $mod+Ctrl+Space.
bindsym --no-warn $mod+space input type:keyboard xkb_switch_layout next
bindsym $mod+Ctrl+space focus mode_toggle
