# Workspaces 1-9 on the external monitor, 10 on the laptop screen.
# Each line lists outputs in order of preference: the HDMI port, then USB-C
# (DP-1), then the laptop screen, so without a monitor everything stays on
# the laptop. The names come from `swaymsg -t get_outputs`.
workspace 1 output HDMI-A-1 DP-1 eDP-1
workspace 2 output HDMI-A-1 DP-1 eDP-1
workspace 3 output HDMI-A-1 DP-1 eDP-1
workspace 4 output HDMI-A-1 DP-1 eDP-1
workspace 5 output HDMI-A-1 DP-1 eDP-1
workspace 6 output HDMI-A-1 DP-1 eDP-1
workspace 7 output HDMI-A-1 DP-1 eDP-1
workspace 8 output HDMI-A-1 DP-1 eDP-1
workspace 9 output HDMI-A-1 DP-1 eDP-1
# 10 falls back to the external monitor while the laptop screen is off.
workspace 10 output eDP-1 HDMI-A-1 DP-1

# Closing the lid with a monitor connected doesn't suspend (logind ignores
# the lid when docked), so turn the laptop screen off: its workspaces (10)
# move to the external monitor and come back when the lid opens. --reload
# applies the lid's current state when the config is reloaded too.
bindswitch --reload --locked lid:on output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable

# Brave always opens on workspace 1 (also at login, from ~/.config/autostart).
# Its Flatpak is Wayland (app_id); the class match covers it under X11. Every
# new Brave window goes there, e.g. Ctrl+N from another workspace too.
# (Bitwarden floats instead: 50-rules-bitwarden.conf.)
assign [app_id="^brave-browser$"] workspace number 1
assign [class="^Brave-browser$"] workspace number 1
