# Workspaces 1-9 on the external monitor, 10 on the laptop screen.
# Each line lists outputs in order of preference: the HDMI port, then USB-C
# (DP-1), then the laptop screen, so without a monitor everything stays on
# the laptop. The names come from `swaymsg -t get_outputs`.
workspace 1 output HDMI-A-1 DP-1 eDP-1
workspace 2 output HDMI-A-1 DP-1 eDP-1
workspace 3 output HDMI-A-1 DP-1 eDP-1
workspace 4 output HDMI-A-1 DP-1 eDP-1
workspace 5 output HDMI-A-1 DP-1 eDP-1
workspace 6 output HDMI-A-1 DP-1 eDP-1
workspace 7 output HDMI-A-1 DP-1 eDP-1
workspace 8 output HDMI-A-1 DP-1 eDP-1
workspace 9 output HDMI-A-1 DP-1 eDP-1
workspace 10 output eDP-1
