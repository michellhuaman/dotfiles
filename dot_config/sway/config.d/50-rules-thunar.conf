# Thunar as a floating window in the middle of the screen, like the
# Bluetooth windows (50-rules-blueman.conf). The size is set because Thunar
# reopens at its last size, which can be a full tiled column. Its app_id is
# thunar (also for its dialogs, which float anyway).

for_window [app_id="^thunar$"] {
    floating enable
    resize set 1100 700
    move position center
}
