# Night light: wlsunset (in Sway Atomic's image) warms the screens to 4000 K
# between sunset and sunrise in Madrid, and back to 6500 K by day, like
# GNOME's automatic night light. The location stays here; nothing is looked
# up online. `exec` runs once per login, not again on a reload.
exec wlsunset -l 40.4 -L -3.7 -t 4000 -T 6500
