# pavucontrol taller than its natural 500x400, which shows only a couple of
# streams. Fedora's rule (/usr/share/sway/config.d/50-rules-pavucontrol.conf)
# already floats and centers it; this file has a different name so it adds
# to that rule instead of replacing it, and it centers again after the resize.
# Its app_id is org.pulseaudio.pavucontrol (Fedora matches "pavucontrol").

for_window [app_id="pavucontrol"] {
    resize set 500 650
    move position center
}
