# btop: its defaults, except the Catppuccin theme, whose "current" link
# theme-toggle.sh points at the current flavor.
#
# Read-only on purpose: settings changed in btop's menu last until btop
# quits, because it can't save them here. To keep one, add its line from
# `btop --default-config` to this file in the dotfiles.
color_theme = "catppuccin_current"
