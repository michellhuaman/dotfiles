{{- /* chezmoi:modify-template */ -}}
{{- /* Renders .chezmoitemplates/btop.conf with the Catppuccin flavor that
       theme-toggle.sh last set in this file (mocha on a new machine), so a
       theme toggle never shows up as a difference. Edit that file, not this. */ -}}
{{- $flavor := regexFind "(latte|frappe|macchiato|mocha)" (lower (regexFind `(?m)^color_theme = .*catppuccin_[a-z]+\.theme` .chezmoi.stdin)) | default "mocha" -}}
{{- includeTemplate "btop.conf" (dict "flavor" $flavor "homeDir" .chezmoi.homeDir) -}}
